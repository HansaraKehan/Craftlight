name: Build and release LightCraft Android APK

# Builds the latest upstream LightCraft (storytold/lightcraft) RELEASE with the Android
# layer applied on top, then publishes the APK as a GitHub Release with the same version.
# The daily check only builds when upstream has published a release that has no Android
# build yet. Changes to this repo's layer alone do not trigger a release.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream release tag to build (empty = upstream's latest release)"
        required: false
        default: ""
      force:
        description: "Build again even if this upstream version already has a release"
        type: boolean
        default: false
      publish:
        description: "Publish a GitHub Release (untick to only build the APK as a downloadable workflow artifact)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  UPSTREAM: storytold/lightcraft
  PUBLISH: ${{ inputs.publish }}
  TARGET: aarch64-linux-android
  NDK_VERSION: 28.2.13676358
  BT_VERSION: 35.0.0
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Pick the upstream release
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          VAR_TAG: ${{ vars.UPSTREAM_TAG }}
        run: |
          # Priority: the ref typed into this run > the repo variable UPSTREAM_TAG (a pinned,
          # tested release) > upstream's latest release.
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          elif [ -n "$VAR_TAG" ]; then
            REF="$VAR_TAG"
          else
            # Fails with a clear error if upstream has never published a release.
            REF=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)
          fi
          echo "Upstream release: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out this repository (the Android layer lives here)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Check out upstream LightCraft
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          path: src

      - name: Work out the release tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          REF_TAG: ${{ steps.ref.outputs.ref }}
        run: |
          VER=$(grep -m1 '^version' src/Cargo.toml | cut -d'"' -f2)
          SHA=$(git -C src rev-parse --short=7 HEAD)
          TAG="android-${REF_TAG}"
          {
            echo "version=$VER"
            echo "sha=$SHA"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = "false" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [ "$FORCE" = "true" ]; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release $TAG already exists - nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add the Android layer on top of upstream
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        run: |
          mkdir -p "$RUNNER_TEMP/layer"
          tar xzf ../fork/android-layer/lightcraft-android-layer.tar.gz -C "$RUNNER_TEMP/layer"
          python3 "$RUNNER_TEMP/layer/apply_layer.py"

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Rust version upstream asks for
        if: steps.ver.outputs.skip != 'true'
        run: |
          # egui 0.36 needs Rust 1.95 even where the workspace still says 1.90: never go below it.
          RUSTV=$(grep -m1 '^rust-version' src/Cargo.toml | cut -d'"' -f2)
          RUSTV=$(printf '%s\n%s\n' "${RUSTV:-1.95}" "1.95" | sort -V | tail -n1)
          rustup toolchain install "$RUSTV" --profile minimal --target "$TARGET"
          rustup default "$RUSTV"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          workspaces: src
          key: android-arm64

      - name: Install Android SDK parts
        if: steps.ver.outputs.skip != 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;${BT_VERSION}" "ndk;${NDK_VERSION}"

      - name: Build native library (Rust)
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        run: |
          BIN="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          cargo build -p lightcraft-android --target "$TARGET" --release -j 3

      - name: Restore signing key
        if: steps.ver.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/lightcraft-signing
          key: lightcraft-signing-v1

      - name: Create signing key if missing
        if: steps.ver.outputs.skip != 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/lightcraft-signing
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > ~/lightcraft-signing/key.p12
            printf '%s' "$KS_PASS" > ~/lightcraft-signing/password.txt
          elif [ ! -f ~/lightcraft-signing/key.p12 ]; then
            openssl rand -base64 24 > ~/lightcraft-signing/password.txt
            keytool -genkeypair -keystore ~/lightcraft-signing/key.p12 -storetype PKCS12 \
              -storepass:file ~/lightcraft-signing/password.txt -alias lightcraft \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=LightCraft Personal Android Build"
          fi

      - name: Package and sign the APK
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          BT="$ANDROID_HOME/build-tools/${BT_VERSION}"
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          B="$RUNNER_TEMP/apk"
          mkdir -p "$B/classes" "$B/dex" "$B/res/drawable" dist
          cp assets/app-icon/hicolor/256x256/apps/ai.storyteller.lightcraft.png "$B/res/drawable/icon.png"

          javac -encoding UTF-8 --release 8 -classpath "$PLATFORM" -d "$B/classes" \
            packaging/android/java/ai/storyteller/lightcraft/*.java
          jar cf "$B/classes.jar" -C "$B/classes" .
          "$BT/d8" --release --min-api 28 --lib "$PLATFORM" --output "$B/dex" "$B/classes.jar"
          "$BT/aapt2" compile --dir "$B/res" -o "$B/resources.zip"
          "$BT/aapt2" link -I "$PLATFORM" --manifest packaging/android/AndroidManifest.xml \
            --version-code "$(( $(date +%s) / 60 ))" --version-name "${TAG}" \
            -o "$B/unsigned.apk" "$B/resources.zip"

          B="$B" LIB="target/${TARGET}/release/liblightcraft_android.so" python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          b = Path(os.environ["B"])
          with zipfile.ZipFile(b / "unsigned.apk", "a", compression=zipfile.ZIP_DEFLATED) as z:
              z.write(b / "dex/classes.dex", "classes.dex")
              z.write(os.environ["LIB"], "lib/arm64-v8a/liblightcraft_android.so")
              for p in ["LICENSE-MIT", "LICENSE-APACHE", "ATTRIBUTION.md",
                        "assets/app-icon/LICENSE.txt", "vendor/winit/LICENSE"]:
                  if Path(p).exists():
                      z.write(p, "assets/licenses/" + p.replace("/", "_"))
          PY

          "$BT/zipalign" -f -P 16 4 "$B/unsigned.apk" "$B/aligned.apk"
          APK="dist/LightCraft-${VERSION}-android-arm64-v8a.apk"
          "$BT/apksigner" sign --ks ~/lightcraft-signing/key.p12 --ks-key-alias lightcraft \
            --ks-pass "file:$HOME/lightcraft-signing/password.txt" --out "$APK" "$B/aligned.apk"
          "$BT/apksigner" verify --verbose "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Keep the APK as a workflow artifact (build-only runs)
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.publish == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: LightCraft-${{ steps.ver.outputs.version }}-android-arm64-v8a
          path: src/${{ env.APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish the release
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.publish == 'true'
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          # Release notes, in this order:
          #  1. The Android features new in this build: the first "## " section of whats-new.md.
          #     Left out when the previous release already showed that same section.
          #  2. What changed upstream since the previous release (commit list).
          #  3. Upstream's own release notes (without contributor tags).
          #  4. Install notes.
          # The previous release is the newest android-* release; its body carries hidden markers
          # with the upstream commit it was built from and the news section it showed.
          NEWS="$RUNNER_TEMP/layer/whats-new.md"
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --exclude-drafts --json tagName --jq '[.[] | select(.tagName | startswith("android-"))][0].tagName' 2>/dev/null || true)
          PREV_BODY=""
          if [ -n "$PREV_TAG" ]; then
            PREV_BODY=$(gh release view "$PREV_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
          fi
          PREV_SHA=$(printf '%s' "$PREV_BODY" | sed -nE 's/.*<!-- upstream-sha:([0-9a-f]+) -->.*/\1/p')
          TOP=""
          if [ -f "$NEWS" ]; then
            TOP=$(awk '/^## /{ if (seen) exit; seen = 1; next } seen' "$NEWS")
          fi
          TOP_ID=$(printf '%s' "$TOP" | sha1sum | cut -c1-12)
          {
            if [ -n "$(printf '%s' "$TOP" | tr -d '[:space:]')" ] && ! printf '%s' "$PREV_BODY" | grep -qF "android-news:${TOP_ID}"; then
              HEAD=$(awk '/^## /{ sub(/^## /, ""); print; exit }' "$NEWS")
              echo "## New in the Android edition: ${HEAD}"
              echo
              printf '%s\n' "$TOP"
              echo
            fi
            echo "## Changes from upstream"
            echo
            if [ -z "$PREV_SHA" ] || ! git rev-parse -q --verify "${PREV_SHA}^{commit}" > /dev/null; then
              echo "First build here, or the previous build's upstream commit is not in the history."
            else
              COUNT=$(git rev-list --no-merges --count "${PREV_SHA}..HEAD")
              if [ "$COUNT" = "0" ]; then
                echo "No upstream commits since the previous build (\`${PREV_SHA}\`)."
              else
                echo "${COUNT} upstream commit(s) since the previous build (\`${PREV_SHA}\` to \`${SHA}\`):"
                echo
                git log --no-merges --max-count=40 --pretty='- %s' "${PREV_SHA}..HEAD"
                if [ "$COUNT" -gt 40 ]; then echo "- and $((COUNT - 40)) more"; fi
              fi
            fi
            if gh release view "$REF" --repo "$UPSTREAM" --json body --jq .body > upstream-raw.md 2>/dev/null && [ -s upstream-raw.md ]; then
              echo
              echo "## Upstream ${REF} release notes"
              echo
              # Without GitHub's "New Contributors" section and the "by @user in <PR>" suffixes.
              awk '/^#+[ \t]*New Contributors[ \t]*$/ { skip = 1; next } /^#+[ \t]/ { skip = 0 } !skip' upstream-raw.md \
                | sed -E 's/ by @[^ ]+ in [^ ]+[[:space:]]*$//; s/@[A-Za-z0-9_-]+//g'
            fi
            echo
            echo "## About this build"
            echo
            echo "**LightCraft ${VERSION} for Android** (early preview, ARM64), built automatically from upstream \`${UPSTREAM}\` release \`${REF}\` (commit \`${SHA}\`) with the Android layer applied."
            echo
            echo "- Needs an ARM64 phone or tablet running Android 9 or newer with a Vulkan GPU."
            echo "- Download the \`.apk\`, open it, and allow installs from your file manager or browser when Android asks."
            echo "- On first start, turn on \"Allow access to manage all files\" so the built-in file browser can see your photos."
            echo "- Unofficial build, not made or supported by the LightCraft team. If an update will not install over an older build, uninstall the old one first."
            echo
            echo "<!-- upstream-sha:$(git -C . rev-parse HEAD) -->"
            echo "<!-- android-news:${TOP_ID} -->"
          } > notes.md
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "LightCraft ${VERSION} Android (${SHA})" --notes-file notes.md

      - name: Update the README's Android features list
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.publish == 'true'
        working-directory: fork
        run: |
          # Every Android feature added so far stays listed in README.md, between the markers below.
          # Regenerated from all "- " bullets in whats-new.md on each release, so the README always
          # describes what the current build can do.
          START='<!-- android-features:start -->'
          END='<!-- android-features:end -->'
          FEATURES=$(grep '^- ' "$RUNNER_TEMP/layer/whats-new.md" || true)
          if [ -z "$FEATURES" ]; then
            echo "No Android features in whats-new.md - README left unchanged."
            exit 0
          fi
          if ! grep -qF "$START" README.md; then
            {
              echo
              echo "## LightCraft for Android"
              echo
              echo "An unofficial Android build is published from this fork's \`android-v*\` releases. What it can do:"
              echo
              echo "$START"
              echo "$END"
            } >> README.md
          fi
          awk -v start="$START" -v end="$END" -v features="$FEATURES" '
            $0 == start { print; print features; skip = 1; next }
            $0 == end { skip = 0 }
            !skip
          ' README.md > README.md.new
          mv README.md.new README.md
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update the Android features list in README [skip ci]"
            git push origin HEAD:main || echo "::warning::couldn't push the README update; update README.md by hand"
          fi
